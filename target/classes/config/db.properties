# ============================================================
# TechShop Manager - Configuration de la base de données
# XAMPP (MySQL/MariaDB) : hôte localhost, port 3306, root sans mot de passe.
# Modifiez ces valeurs si votre installation diffère.
# ============================================================
db.host=localhost
db.port=3306
db.name=techshop
db.user=root
db.password=

# --- Pool de connexions HikariCP ---
db.pool.size=10
db.pool.minIdle=2
db.pool.timeoutMs=30000
